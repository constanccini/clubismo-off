name: Publicar Clubismo Off

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Aprovação enviada pelo botão Publicar do Pages CMS
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Instalar o painel na primeira execução
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            test -f painel-fonte.zip || { echo 'Envie painel-fonte.zip para a raiz do repositório primeiro.'; exit 1; }
            python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          with ZipFile('painel-fonte.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] in {'.git', '.github', '.openai'}:
                      raise ValueError('Caminho inválido no pacote: ' + name)
              archive.extractall('.')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            git commit -m 'Instalar conteúdo editável e painel do Clubismo Off'
            git push origin HEAD:main
          fi
      - name: Aplicar atualização da redação quando enviada
        shell: bash
        run: |
          if [ -f atualizacao-redacao.zip ]; then
            python3 - <<'PYUPDATE'
          import hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          with ZipFile('atualizacao-redacao.zip') as archive:
              manifest = json.loads(archive.read('manifest.json'))
              pending = []
              for item in manifest['files']:
                  name = item['path']
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or '\\' in name or str(path) != name:
                      raise ValueError('Caminho inválido: ' + name)
                  if path.parts[0] not in {'app', 'components', 'lib', 'scripts', 'tests', '.pages.yml', '.gitignore', 'tsconfig.json', 'REDACAO.md'}:
                      raise ValueError('Arquivo fora da atualização: ' + name)
                  data = archive.read('files/' + name)
                  if hashlib.sha256(data).hexdigest() != item['sha256']:
                      raise ValueError('Pacote inválido: ' + name)
                  target = Path(name)
                  current = blob_sha(target.read_bytes()) if target.exists() else None
                  if current not in {item['base_sha'], blob_sha(data)}:
                      raise ValueError('Arquivo alterado após preparar o pacote: ' + name + '. Preserve sua versão e peça uma atualização do pacote.')
                  pending.append((target, data))
              for target, data in pending:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              subprocess.run(['git', 'add', '--', *[str(target) for target, _ in pending]], check=True)
          PYUPDATE
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -- atualizacao-redacao.zip
            if ! git diff --cached --quiet; then
              git commit -m 'Instalar fila de aprovação da Redação Clubismo Off'
              git push origin HEAD:main
            fi
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --prod=false
      - name: Verificar conteúdo
        run: node --test tests/*.test.mjs
      - name: Preparar a matéria aprovada no Pages CMS
        id: publish_news
        if: github.event_name == 'workflow_dispatch' && inputs.payload != ''
        run: node scripts/publish-news.mjs
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
      - name: Obter endereço do blog
        id: pages
        uses: actions/configure-pages@v5
      - name: Gerar páginas estáticas
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Mover a matéria da Fila para Matérias
        if: steps.publish_news.outputs.changed == 'true'
        shell: bash
        env:
          SOURCE_PATH: ${{ steps.publish_news.outputs.source_path }}
          TARGET_PATH: ${{ steps.publish_news.outputs.target_path }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$SOURCE_PATH" "$TARGET_PATH"
          git commit -m 'Publicar matéria aprovada no Pages CMS'
          git push origin HEAD:main
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
