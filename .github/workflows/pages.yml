name: Publicar Clubismo Off

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Instalar o painel na primeira execução
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            test -f painel-fonte.zip || { echo 'Envie painel-fonte.zip para a raiz do repositório primeiro.'; exit 1; }
            python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          with ZipFile('painel-fonte.zip') as archive:
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0] in {'.git', '.github', '.openai'}:
                      raise ValueError('Caminho inválido no pacote: ' + name)
              archive.extractall('.')
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --all
            git commit -m 'Instalar conteúdo editável e painel do Clubismo Off'
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --prod=false
      - name: Verificar conteúdo
        run: node --test tests/editorial.test.mjs
      - name: Obter endereço do blog
        id: pages
        uses: actions/configure-pages@v5
      - name: Gerar páginas estáticas
        run: pnpm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Preparar publicação
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
